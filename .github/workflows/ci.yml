name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      OTP_VERSION: '27.3'
      ELIXIR_VERSION: '1.19.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang / Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: native/cashew/target
          key: cargo-${{ hashFiles('native/cashew/Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: cargo fmt
        run: cargo fmt --check --manifest-path native/cashew/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path native/cashew/Cargo.toml -- -D warnings

      - name: mix format
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Tests
        run: mix test

      - name: Dialyzer
        run: mix dialyzer --format short
