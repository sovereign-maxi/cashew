[package]
name = "cashew"
version = "0.1.0"
edition = "2021"

[lib]
name = "cashew"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "=0.37.0"
secp256k1 = { version = "=0.30.0", features = ["global-context", "rand"] }
sha2 = "=0.10.8"
rand = "=0.8.5"
subtle = "=2.6.1"
zeroize = "=1.8.1"
